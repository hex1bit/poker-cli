[package]
name = "poker"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "poker"
path = "src/main.rs"

[[bin]]
name = "ratatui_poc"
path = "src/bin/ratatui_poc.rs"

[dependencies]
crossterm = "0.28"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "equity_bench"
harness = false

[profile.release]
opt-level = 3
